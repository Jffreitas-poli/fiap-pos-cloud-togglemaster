apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-configmap
  namespace: toggle
data:
  PORT: "8005"
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/047719652987/tc-prod-sqs"
  AWS_DYNAMODB_TABLE: "tc-prod-dynamo"
  AWS_REGION: "us-east-1"
  OTEL_SERVICE_NAME: "analytics-service"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/json"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_TRACES_EXPORTER: "otlp"