services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8001:8001
    environment:
      - DATABASE_URL=postgres://postgres:44d870fc@auth-postgres:5432/auth_db
      - PORT=8001
      - MASTER_KEY=admin-secreto-123
    depends_on:
      - auth-postgres
    networks:
      - shared
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  auth-postgres:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=44d870fc
      - POSTGRES_DB=auth_db
    expose:
      - 5432
    volumes:
      - auth-postgres-data:/var/lib/postgresql/18/docker
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shared
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  auth-postgres-data:

networks:
  shared:
    external: true
    name: inter-project