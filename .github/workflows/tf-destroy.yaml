# ============================================
# WORKFLOW: Execução de arquivos terraform
# ============================================
name: TF-destroy

on:
  workflow_dispatch:  # Permite execução manual
    inputs:
      branch:
        required: true
        default: 'main'
        type: choice
        options:
        - main

env:
  AWS_REGION: us-east-1
  WORK_DIR: .infra/environment/prod

permissions:
  id-token: write   # Permissão para autenticar em prod
  contents: read

jobs:
  # ============================================
  # JOB: Execução do terraform
  # ============================================
  terraform:
    name: 'Terraform Destroy'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ${{ env.WORK_DIR }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.ROLE_GITHUB_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.0

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      env:
        TF_VAR_env: "prod"
        TF_VAR_rds_passs: ${{ secrets.DB_PASSWORD }}
        TF_VAR_eks_developer_arns: ${{ secrets.DEVELOPER_ARNS }}
        TF_VAR_git_repo_claim_prefix: ${{ secrets.GIT_REPO_CLAIM }}
      run: terraform plan -no-color -out=tfplan

    - name: Terraform Destroy
      run: terraform destroy -input=false tfplan