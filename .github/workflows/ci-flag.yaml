# ============================================
# WORKFLOW: Deploy da imagem para ECR
# Automatiza build e deploy da aplicação
# ============================================
name: CI - flag

on:
#  push:
#    branches: [main]
  workflow_dispatch:  # Permite execução manual

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tc-prod-ecr-flag
  WORK_DIR: flag-service-main

permissions:
  id-token: write   # Permissão para autenticar em prod
  contents: read

jobs:
  # ============================================
  # JOB: Lint (Verificação de erros no código)
  # ============================================
  lint:
    name: Lint com Pylint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./${{ env.WORK_DIR }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Pylint
      run: |
        pylint --errors-only $(git ls-files '*.py')


  # ============================================
  # JOB: SCA (vulnerabilidades de dependencias)
  # ============================================
  sca:
    name: SCA com Trivy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./${{ env.WORK_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ env.WORK_DIR }}'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'


  # ============================================
  # JOB: SAST (vulnerabilidades no código)
  # ============================================
  sast:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./${{ env.WORK_DIR }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit

    - name: Run Bandit SAST scan
      run: |
        bandit -r . -lll -iii