# ============================================
# WORKFLOW: Deploy da imagem para ECR
# Automatiza build e deploy da aplicação
# ============================================
name: CI - flag

on:
#  push:
#    branches: [main]
  workflow_dispatch:  # Permite execução manual

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tc-prod-ecr-flag
  WORK_DIR: flag-service-main

permissions:
  id-token: write   # Permissão para autenticar em prod
  contents: read

jobs:
  # ============================================
  # JOB: Lint (Verificação de erros no código)
  # ============================================
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./${{ env.WORK_DIR }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Pylint
      run: |
        pylint $(git ls-files '*.py')