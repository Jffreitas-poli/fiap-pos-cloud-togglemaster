mode: deployment
replicaCount: 1

image:
  # Use the contrib/k8s distribution so k8sattributes, loki, and prometheus exporters are included
  repository: otel/opentelemetry-collector-contrib

presets:
  # Automatically stamps k8s.pod.name, k8s.namespace.name, etc. onto telemetry
  kubernetesAttributes:
    enabled: true

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  exporters:
    # 1. Ship Logs to Loki's native OTLP endpoint
    otlphttp/loki:
      endpoint: http://loki-gateway.loki.svc.cluster.local/otlp
      headers: 
        X-Scope-OrgID: "togglekubectl logs -n <otel-namespace> deploy/<otel-collector> --tail=30 | grep -i -E "error|401|loki|otlp""
      tls:
        insecure: true

    # 2. Ship Metrics to Prometheus's native OTLP endpoint
    otlphttp/prometheus:
      endpoint: http://prometheus-server.prometheus.svc.cluster.local:80/api/v1/otlp
      tls:
        insecure: true

    # 3. Drop traces for now (until you add Datadog later)
    debug/traces:
      verbosity: basic

  service:
    pipelines:
      logs:
        receivers: [otlp]
        processors: [k8sattributes, batch]
        exporters: [otlphttp/loki]
      metrics:
        receivers: [otlp]
        processors: [k8sattributes, batch]
        exporters: [otlphttp/prometheus]
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug/traces]