mode: deployment
replicaCount: 1

image:
  # Use the contrib/k8s distribution so k8sattributes, loki, and prometheus exporters are included
  repository: otel/opentelemetry-collector-contrib

presets:
  # Automatically stamps k8s.pod.name, k8s.namespace.name, etc. onto telemetry
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true
  clusterMetrics:
    enabled: true

extraEnvs:
  - name: LOKI_USERNAME
    valueFrom:
      secretKeyRef:
        name: loki-basic-auth
        key: username
  - name: LOKI_PASSWORD
    valueFrom:
      secretKeyRef:
        name: loki-basic-auth
        key: password
  - name: NEW_RELIC_LICENSE_KEY
    valueFrom:
      secretKeyRef:
        name: new-relic-auth
        key: license

config:
  extensions:
    health_check: {}
    basicauth/client:
      client_auth:
        username: ${env:LOKI_USERNAME}
        password: ${env:LOKI_PASSWORD}
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    k8s_cluster:
      collection_interval: 30s
      node_conditions_to_report: [Ready, MemoryPressure, DiskPressure]
      allocatable_types_to_report: [cpu, memory]

  processors:
    batch: {}
    k8s_attributes:
      auth_type: "serviceAccount"
      passthrough: false
      extract:
        metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.deployment.name
          - k8s.namespace.name
          - k8s.node.name

  exporters:
    # 1. Ship Logs to Loki's native OTLP endpoint
    otlp_http/loki:
      endpoint: http://loki-gateway.loki.svc.cluster.local:80/otlp
      auth:
        authenticator: basicauth/client
      headers: 
        X-Scope-OrgID: "toggle"
      tls:
        insecure: true

    # 2. Ship Metrics to Prometheus's native OTLP endpoint
    otlp_http/prometheus:
      endpoint: http://prometheus-server.prometheus.svc.cluster.local:80/api/v1/otlp
      tls:
        insecure: true

    # 3. Drop traces for now (until you add Newrelic later)
    otlp_http/newrelic:
      endpoint: https://otlp.nr-data.net
      headers:
        api-key: ${env:NEW_RELIC_LICENSE_KEY}

  service:
    extensions: [health_check, basicauth/client]
    pipelines:
      logs:
        receivers: [otlp]
        processors: [k8s_attributes, batch]
        exporters: [otlp_http/loki]
      metrics:
        receivers: [otlp, k8s_cluster]
        processors: [k8s_attributes, batch]
        exporters: [otlp_http/prometheus]
      traces:
        receivers: [otlp]
        processors: [k8s_attributes, batch]
        exporters: [otlp_http/newrelic]