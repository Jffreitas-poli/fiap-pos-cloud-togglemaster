apiVersion: v1
kind: ConfigMap
metadata:
  name: flag-configmap
  namespace: flag
data:
  PORT: "8002"
  AUTH_SERVICE_URL: "http://auth-service.auth.svc.cluster.local:8001"
spec:
  template:
    spec:
      containers:
        - image: null
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-deployment
  namespace: flag
  labels:
    app: flag
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flag
  template:
    metadata:
      labels:
        app: flag
    spec:
      containers:
        - name: flag-container
          image: 047719652987.dkr.ecr.us-east-1.amazonaws.com/tc-prod-ecr-flag:2e61f271
          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "40m"
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: flag-configmap
            - secretRef:
                name: flag-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flag-ingress
  namespace: flag
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /flag(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: flag-service
                port:
                  number: 8002
  template:
    spec:
      containers:
        - image: null
---
apiVersion: v1
kind: Namespace
metadata:
  name: flag
spec:
  template:
    spec:
      containers:
        - image: null
---
apiVersion: v1
kind: Secret
metadata:
  creationTimestamp: null
  name: flag-secret
  namespace: flag
type: Opaque
data:
  DATABASE_URL: cG9zdGdyZXM6Ly9wb3N0Z3JlczpLY1k4TkpRQUQxTWFLTkNUQUJ0a0B0Yy1wcm9kLXJkcy1mbGFnLmNramNrNDRvMmN4Zy51cy1lYXN0LTEucmRzLmFtYXpvbmF3cy5jb206NTQzMi9mbGFnc19kYg==
spec:
  template:
    spec:
      containers:
        - image: null
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: flag
spec:
  selector:
    app: flag
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
  type: ClusterIP
  template:
    spec:
      containers:
        - image: null
