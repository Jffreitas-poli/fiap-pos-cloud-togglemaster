apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-deployment
  namespace: toggle
  labels:
    app: evaluation
spec:
  replicas: 3
  selector:
    matchLabels:
      app: evaluation
  template:
    metadata:
      labels:
        app: evaluation
    spec:
      serviceAccountName: evaluation-service
      containers:
        - name: evaluation-container
          image: 047719652987.dkr.ecr.us-east-1.amazonaws.com/tc-prod-ecr-evaluation:6118c002
          resources:
            requests:
              memory: "128Mi"
              cpu: "40m"
            limits:
              memory: "256Mi"
              cpu: "80m"
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: evaluation-configmap
            - secretRef:
                name: evaluation-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 20
            periodSeconds: 20
