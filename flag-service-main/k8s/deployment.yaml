apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-deployment
  namespace: toggle
  labels:
    app: flag
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flag
  template:
    metadata:
      labels:
        app: flag
    spec:
      containers:
        - name: flag-container
          image: 047719652987.dkr.ecr.us-east-1.amazonaws.com/tc-prod-ecr-flag:6de8fac2
          resources:
            requests:
              memory: "128Mi"
              cpu: "40m"
            limits:
              memory: "256Mi"
              cpu: "80m"
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: flag-configmap
            - secretRef:
                name: flag-secret
          startupProbe:
            httpGet:
              path: /health
              port: 8002
            failureThreshold: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 20
