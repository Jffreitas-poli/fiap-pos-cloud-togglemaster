services:
  flag:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8002:8002
    environment:
      - DATABASE_URL=postgres://postgres:afd0c587@flag-postgres:5432/flags_db
      - PORT=8002
      - AUTH_SERVICE_URL=http://auth-service-main-auth-1:8001
    depends_on:
      - flag-postgres
    networks:
      - shared
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  flag-postgres:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=afd0c587
      - POSTGRES_DB=flags_db
    expose:
      - 5432
    volumes:
      - flag-postgres-data:/var/lib/postgresql/18/docker
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shared
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  flag-postgres-data:

networks:
  shared:
    external: true
    name: inter-project