apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-deployment
  namespace: toggle
  labels:
    app: targeting
spec:
  replicas: 3
  selector:
    matchLabels:
      app: targeting
  template:
    metadata:
      labels:
        app: targeting
    spec:
      containers:
        - name: targeting-container
          image: 047719652987.dkr.ecr.us-east-1.amazonaws.com/tc-prod-ecr-targeting:916d3e4d
          resources:
            requests:
              memory: "128Mi"
              cpu: "40m"
            limits:
              memory: "256Mi"
              cpu: "80m"
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: targeting-configmap
            - secretRef:
                name: targeting-secret
          startupProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
